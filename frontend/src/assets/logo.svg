<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Dark contrast background to make white and green pop -->
    <style>
      .bg { fill: #0F172A; rx: 16px; }
      .brand-title { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: #FFFFFF; letter-spacing: -0.5px; }
      .brand-highlight { fill: #10B981; font-weight: 800; }
      .brand-tagline { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #94A3B8; letter-spacing: 2.5px; }
    </style>
    
    <!-- Gradient for the connecting bridge line -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  

  <!-- Logo Icon: SkillBridge (Connecting Nodes / Upward Arch / Bridge) -->
  <g transform="translate(35, 20)">
    <!-- Bridge Arch / Growth Curve -->
    <path d="M 12 58 C 28 20, 60 20, 76 58" fill="none" stroke="url(#bridgeGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left Professional Node (White) -->
    <circle cx="12" cy="58" r="9" fill="#FFFFFF"/>
    <circle cx="12" cy="58" r="4" fill="#0F172A"/>

    <!-- Right Earning/Success Node (Green) -->
    <circle cx="76" cy="58" r="9" fill="#10B981"/>
    <circle cx="76" cy="58" r="4" fill="#0F172A"/>

    <!-- Center Bridge Apex / Currency Spark (Green) -->
    <path d="M 44 14 L 47 24 L 57 27 L 47 30 L 44 40 L 41 30 L 31 27 L 41 24 Z" fill="#10B981"/>
    
    <!-- Inner Connective Flow Lines -->
    <path d="M 22 58 Q 44 42 66 58" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="135" y="62" class="brand-title">Skill<tspan class="brand-highlight">Bridge</tspan></text>
  <text x="136" y="84" class="brand-tagline">EXPERT HELP • EARN VALUE</text>
</svg>